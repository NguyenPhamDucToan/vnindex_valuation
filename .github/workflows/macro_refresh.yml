name: Weekly macro data refresh

on:
  schedule:
    # 02:00 UTC Sunday = 09:00 ICT Sunday
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

jobs:
  macro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run macro collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
          # vnstock 5.1+ refuses the guest tier on GitHub Actions.
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python run_macro.py
