name: Keep Streamlit app awake (real browser)

# A plain HTTP ping (curl, UptimeRobot's default HTTP(s) monitor, etc.) only
# ever reaches Streamlit Community Cloud's static shell -- an empty
# <div id="root"></div>, ~6KB, with zero app data in it. The actual Python
# app only starts (and its "someone is using this" clock only resets) once a
# real browser opens a WebSocket connection to the backend -- confirmed
# directly: curl's response body has no websocket reference and an empty
# root div. So a curl-based keep-alive or an UptimeRobot HTTP monitor
# genuinely does NOT prevent the cold-boot the next visitor pays.
#
# This workflow uses a real (headless) browser via Playwright so the same
# WebSocket handshake a human visitor's browser performs actually happens.
#
# DELIBERATELY NOT trying to verify the app fully rendered (no DOM/selector
# checks). Several iterations of that (waiting for a selector, retrying,
# widening timeouts) kept reporting "failed" even when a screenshot taken
# in that same failure branch showed the app completely loaded -- the
# verification itself was unreliable (innerText and friends can read as
# empty for CSS/animation reasons totally unrelated to whether the page
# actually rendered), not the wake. The thing that actually matters here
# -- the browser opening a WebSocket connection to the backend -- already
# happens at page.goto(); everything after that was just an unreliable
# progress bar. So: navigate, wait a fixed amount for good measure, always
# save a screenshot for anyone who wants to eyeball it, and call it done.
# Look at the screenshot artifact if you want actual confirmation, not the
# job's green/red status.

# Budget note: the 2,000 min/month Actions cap only applies to private
# repos. This repo is public now, so Actions minutes are free/unlimited on
# standard runners -- restored to the original every-25-min cadence (the
# 4-hour throttle below was only ever a workaround for the private-repo
# quota, not a real requirement). Still scoped to Vietnam waking hours
# (no point pinging at 3am ICT when nobody's visiting): UTC 23:00-14:00
# maps to ICT 06:00-21:00.
on:
  schedule:
    - cron: "7/25 23,0-14 * * *"
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned exact: an unpinned `pip install playwright` can resolve a
      # newer release on a later run than whatever populated the Chromium
      # cache below. The cache key never accounted for that -- it only
      # changes when this YAML file changes -- so a plain version bump on
      # PyPI silently desynced the cached browser build from what the freshly
      # -installed client library expects, and every run failed with
      # "BrowserType.launch: Executable doesn't exist at .../chromium_headless
      # _shell-NNNN/..." until something happened to invalidate the cache.
      # Pinning here, and baking the pin into the cache key, means a future
      # manual version bump is what invalidates the cache (as intended)
      # instead of an untracked upstream release doing it silently.
      - name: Install Playwright package
        run: pip install playwright==1.62.0

      - name: Cache Chromium browser binary
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.62.0

      - name: Install Chromium (only on cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies (fast, needed even on cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Load the app in a real browser (wakes it via WebSocket)
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright

          URL = "https://vnindex-valuation.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(
                  viewport={"width": 1280, "height": 800},
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                      "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                  ),
              )
              resp = page.goto(URL, wait_until="load", timeout=120000)
              print(f"goto status: {resp.status if resp else 'no response object'}, url: {page.url}")
              # Fixed wait, not a content check -- gives the backend script a
              # real chance to run before we disconnect, without depending on
              # a DOM query that's proven unreliable as a signal either way.
              # Restored to 60s (was cut to 30s to save Actions minutes on
              # the private-repo budget) -- public repo now, so more
              # backend-spin-up headroom costs nothing.
              page.wait_for_timeout(60000)
              page.screenshot(path="snapshot.png", full_page=True)
              print("Wake request sent; snapshot.png saved for manual review.")
              browser.close()
          EOF

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wake-snapshot
          path: snapshot.png
          if-no-files-found: ignore
          retention-days: 3
