name: Daily price + valuation refresh

on:
  schedule:
    # 09:03 UTC = 16:03 ICT, Mon-Fri (1h after HOSE closes at 15:00 ICT).
    # :03 instead of :00 on purpose -- GitHub's shared runners queue up
    # scheduled workflows from every repo hitting the same round minute,
    # so a few minutes off top-of-hour tends to start closer to on-time.
    - cron: "3 9 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # Was ~55-100 min under vnstock 5's 10-calls/minute quota; with vndata
    # (VCI directly, 1s between tickers) the price sweep is ~15 min plus the
    # valuation pass. The web repo's deploy waits for this run to finish
    # before exporting, so a late start here only delays it.
    # Repo is public now, so Actions minutes are free/unlimited -- no reason
    # to cut this tight anymore. 300 leaves real headroom for a slow-API day
    # instead of getting cancelled mid-run (happened at the old 90 cap on
    # 2026-08-05: a run that needed a bit more than 90 min got killed with
    # ~90 min of work already sunk, wasting the whole day's refresh).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price + valuation refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python run_prices_then_valuations.py

      # Data quality audit (quality/audit.py): stale prices, missing quarters,
      # unit errors. Appends to data_quality_log; the web export turns the
      # latest run into data/quality.json and a badge. Findings never fail the
      # job -- it runs even when the refresh failed, which is when it matters.
      - name: Data quality audit
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python -m quality.audit
