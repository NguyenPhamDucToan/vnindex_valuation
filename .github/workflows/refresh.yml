name: Daily price + valuation refresh

on:
  schedule:
    # 11:30 UTC = 18:30 ICT, Mon-Fri (after HOSE closes at 15:00 ICT)
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price + valuation refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python run_prices_then_valuations.py
