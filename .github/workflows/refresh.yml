name: Daily price + valuation refresh

on:
  schedule:
    # 09:03 UTC = 16:03 ICT, Mon-Fri (1h after HOSE closes at 15:00 ICT).
    # :03 instead of :00 on purpose -- GitHub's shared runners queue up
    # scheduled workflows from every repo hitting the same round minute,
    # so a few minutes off top-of-hour tends to start closer to on-time.
    - cron: "3 9 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A healthy full run is ~51 min (641 tickers at the 2s vnstock delay).
    # Capped at 90 (down from 150) so a hung/stuck run can't quietly burn an
    # extra hour of the monthly Actions budget -- 90 still leaves ~75% headroom
    # over a normal run for slower API days.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price + valuation refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python run_prices_then_valuations.py
