<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/plotly.js@2.35.2/dist/plotly.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #0e1117 !important; }
#plot { width: 100%; height: 1050px; background: #0e1117; }
#err { color: red; font-size: 12px; padding: 8px; }
</style>
</head>
<body>
<div id="plot"></div>
<div id="err"></div>
<script>
var Streamlit = {
  _sendMessage: function(type, data) {
    window.parent.postMessage(Object.assign({type: type, isStreamlitMessage: true}, data), "*");
  },
  setComponentValue: function(value) {
    this._sendMessage("streamlit:setComponentValue", {value: value, dataType: "json"});
  },
  setFrameHeight: function(h) {
    this._sendMessage("streamlit:setFrameHeight", {height: h});
  },
  ready: function() {
    this._sendMessage("streamlit:componentReady", {apiVersion: 1});
  }
};

function onRender(event) {
  if (!event.data || event.data.type !== "streamlit:render") return;
  var args = event.data.args;
  if (!args || !args.fig_json) return;

  try {
    var fig = JSON.parse(args.fig_json);
    fig.layout.paper_bgcolor = "rgba(0,0,0,0)";
    fig.layout.plot_bgcolor  = "rgba(0,0,0,0)";

    // On narrow screens, the fixed desktop height (1050px) gets squeezed
    // into a much narrower width, shrinking every box to an unreadable
    // sliver. Compensate by making the treemap taller (more vertical
    // scroll, but each box keeps a readable amount of area) instead of
    // letting box size shrink along with the width.
    var w = window.innerWidth || document.documentElement.clientWidth;
    var plotHeight = w < 640 ? 2400 : 1050;
    fig.layout.height = plotHeight;
    document.getElementById("plot").style.height = plotHeight + "px";
    Streamlit.setFrameHeight(plotHeight);

    Plotly.react("plot", fig.data, fig.layout, {responsive: true, displayModeBar: false})
      .then(function(gd) {
        gd.on("plotly_treemapclick", function(ev) {
          try {
            if (ev && ev.points && ev.points[0]) {
              var id = String(ev.points[0].id || "");
              if (id.indexOf("_") !== -1) {
                // TICKER node: prevent drill-down, send to Python for popup
                var ticker = id.split("_").slice(1).join("_").trim();
                if (ticker && ticker.length >= 2 && ticker.length <= 6) {
                  Streamlit.setComponentValue("TICKER:" + ticker);
                }
                return false; // block drill-down only for tickers
              }
              // SECTOR node: allow native drill-down (return nothing = default behavior)
              // Also notify Python so it can track state if needed
              if (id && id.length > 0) {
                Streamlit.setComponentValue("SECTOR:" + id);
              }
            }
          } catch(e2) {}
          // Don't return false for sectors — allow Plotly drill-down
        });
      });
  } catch(e) {
    document.getElementById("err").textContent = "Error: " + e.message;
  }
}

window.addEventListener("message", onRender);
Streamlit.ready();
</script>
</body>
</html>
